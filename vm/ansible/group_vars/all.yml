---
# Path to Terraform project: vm/terraform/libvirt, vm/terraform/aws, or vm/terraform/azure (chosen by backend)
terraform_project_path: "{{ playbook_dir }}/../../terraform/{{ backend }}"

# SSH public key: read from provisioner's ~/.ssh/id_rsa.pub by default; or set vault_ssh_public_key in vault to override.
ssh_public_key: "{{ vault_ssh_public_key | default(lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub')) }}"

# Backend: libvirt, aws, or azure
backend: libvirt

# Couchbase minimum production (pre-install docs)
vm_name: couchbase-vm
vcpu: 2
memory_mib: 4096
disk_gib: 16

# Libvirt
libvirt_uri: "qemu:///system"
libvirt_base_image: rhel-10.1-x86_64-kvm.qcow2
libvirt_pool: default
libvirt_network_name: default

# AWS (used when backend is aws)
aws_region: us-east-2
aws_ami_id: ami-0886072325c42ee75
aws_instance_type: t3.medium
aws_key_name: ""
aws_subnet_id: ""

# Azure (used when backend is azure)
azure_location: "East US"
azure_resource_group_name: ""
azure_vm_size: Standard_B2s
azure_image:
  publisher: RedHat
  offer: rhel
  sku: "9-lvm"
  version: latest
azure_subnet_id: ""

# Couchbase Server (VM install via couchbase_server_install role; version matches ArgoCD cluster)
# Ref: https://docs.couchbase.com/server/current/install/rhel-suse-install-intro.html
# ArgoCD: argocd/manifests/couchbase/cluster/cluster.yaml image couchbase/server:8.0.0
couchbase_server_install_edition: community
couchbase_server_install_version: "8.0.0-3777"  # match ArgoCD server:8.0.0; use dnf list --showduplicates couchbase-server for build
couchbase_server_install_release_rpm_url: "https://packages.couchbase.com/releases/couchbase-release/couchbase-release-1.0.noarch.rpm"
couchbase_server_install_set_limits: true
