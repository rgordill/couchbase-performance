---
# Terraform is applied from the controller (localhost).
# Add deployed VM(s) to couchbase_servers for install_couchbase.yml (use IP from Terraform output).
all:
  children:
    terraform_runner:
      hosts:
        localhost:
          ansible_connection: local
    couchbase_servers:
      hosts: {}
      # Example: add VM after Terraform deploy
      #   vm1:
      #     ansible_host: 192.168.122.42
      #     ansible_user: cloud-user   # libvirt
      #     # ansible_user: ec2-user   # AWS
      #     # ansible_user: azureuser  # Azure
