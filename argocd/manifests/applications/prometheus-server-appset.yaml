---
# ApplicationSet: Prometheus server via Helm (prometheus-community chart).
# Chart: https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus
# Values from Git; Ingress host injected via helm.parameters from cluster secret annotation ingress-domain.
# Second source applies the basic-auth Secret (same namespace).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus-server
  namespace: openshift-gitops
spec:
  project: couchbase-performance
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/cluster-name: in-cluster
  template:
    metadata:
      name: 'prometheus-server'
      namespace: openshift-gitops
      annotations:
        argocd.argoproj.io/sync-wave: "2"
        ingress-host: 'prometheus-server.{{ index .metadata.annotations "ingress-domain" }}'
    spec:
      project: couchbase-performance
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: prometheus
          targetRevision: "28.13.0"
          helm:
            releaseName: prometheus-server
            valueFiles:
              - $values/argocd/manifests/prometheus-server/values.yaml
            parameters:
              - name: server.ingress.hosts[0]
                value: "prometheus-server.{{ index .metadata.annotations "ingress-domain" }}"
              - name: server.ingress.tls[0].hosts[0]
                value: "prometheus-server.{{ index .metadata.annotations "ingress-domain" }}"
        - repoURL: https://github.com/rgordill/couchbase-performance.git
          targetRevision: HEAD
          ref: values
          path: argocd/manifests/prometheus-server
      destination:
        server: '{{.server}}'
        namespace: couchbase
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - ServerSideApply=false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
