# Values for prometheus-community Helm chart (https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus).
# Remote-write-only: no scraping; clients POST to /api/v1/write. StatefulSet, 10Gi PVC, Ingress with TLS + basic auth.
# Ingress host is overridden at deploy time via ApplicationSet helm parameters (prometheus-server.<ingress-domain>).

# configmap-reload sidecar: disabled to avoid connection errors. The reloader starts before
# Prometheus is ready (WAL replay takes ~1+ min) and retries to 127.0.0.1:9090/-/reload every few
# seconds, flooding logs with "connection refused". Config changes are applied when the ConfigMap
# is updated and the pod is recreated (e.g. Argo CD sync / rollout).
configmapReload:
  prometheus:
    enabled: false
    containerSecurityContext: {}

# Subcharts: we only need the Prometheus server
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

# Release-wide
forceNamespace: couchbase

# Remote-write + self-scrape only. All other jobs disabled; config must be at root to override chart defaults.
scrapeConfigs:
  prometheus:
    enabled: true
    job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false

server:
  fullnameOverride: prometheus-server

  # Remote write receiver only (no scrape, no lifecycle/reload API)
  extraArgs:
    web.enable-remote-write-receiver: ""

  # StatefulSet + 10Gi PVC
  statefulSet:
    enabled: true
  replicaCount: 1
  persistentVolume:
    enabled: true
    size: 10Gi
    mountPath: /data
    accessModes:
      - ReadWriteOnce

  # OpenShift: do not set runAsUser/fsGroup so the namespace's allocated UID range is used (restricted-v2 SCC).
  # Chart default is 65534 (nobody), which is forbidden; explicitly null these so they are omitted.
  securityContext:
    runAsUser: null
    runAsGroup: null
    fsGroup: null
    runAsNonRoot: null
  containerSecurityContext: {}

  # Ingress: TLS + basic auth; host set by ApplicationSet parameters
  ingress:
    enabled: true
    ingressClassName: openshift-default
    path: /
    pathType: Prefix
    hosts:
      - PLACEHOLDER
    tls:
      - secretName: prometheus-server-tls
        hosts:
          - PLACEHOLDER
    annotations:
      route.openshift.io/termination: edge
      route.openshift.io/insecureEdgeTerminationPolicy: Redirect
      cert-manager.io/cluster-issuer: lab-ca-issuer
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Prometheus - authentication required"

  # Resources (align with previous manifests)
  resources:
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 4Gi

  # Service: chart default servicePort 80 is fine (maps to container 9090)
  service:
    enabled: true
