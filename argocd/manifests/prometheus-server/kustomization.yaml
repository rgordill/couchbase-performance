# Custom Prometheus server (no operator): remote write receiver, Ingress with TLS + basic auth.
# Ingress host: ApplicationSet injects prometheus-server.<ingress-domain> via kustomize patches.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - statefulset.yaml
  - service.yaml
  - secret-basic-auth.yaml
  - ingress.yaml
