---
# Basic auth credentials for Prometheus Ingress (read UI and remote write API).
# Format: key "auth" = htpasswd line (user:hashed_password).
# Replace with your own credentials before use; do not commit real passwords to Git.
#
# Replace with your own credentials before production use:
#   htpasswd -nb YOUR_USER YOUR_PASS > auth
#   kubectl create secret generic prometheus-basic-auth --from-file=auth -n couchbase --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-basic-auth
  namespace: couchbase
  labels:
    app: prometheus-server
type: Opaque
stringData:
  # Default for dev only: user "prometheus" / password "changeme". Replace before production.
  auth: "prometheus:$apr1$PxbCo3BU$nHCy.LOjOmZ0DNmoDznpz0"
