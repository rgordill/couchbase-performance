---
# Ingress for Prometheus UI and remote write API (edge TLS + basic auth).
# Host: ApplicationSet kustomize patches replace PLACEHOLDER with prometheus-server.<ingress-domain>.
# TLS: cert-manager creates prometheus-server-tls from ClusterIssuer lab-ca-issuer.
# Basic auth: Secret prometheus-basic-auth (key "auth", htpasswd format). Protects read and write.
# For basic auth to work, the Ingress controller must support it (e.g. nginx); OpenShift default router may not.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-server
  namespace: couchbase
  labels:
    app: prometheus-server
  annotations:
    route.openshift.io/termination: edge
    route.openshift.io/insecureEdgeTerminationPolicy: Redirect
    cert-manager.io/cluster-issuer: lab-ca-issuer
    # Basic auth (read + write). Supported by nginx ingress; for OpenShift default router see README.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Prometheus - authentication required"
spec:
  ingressClassName: openshift-default
  tls:
    - hosts:
        - PLACEHOLDER
      secretName: prometheus-server-tls
  rules:
    - host: PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-server
                port:
                  number: 9090
