# OpenShift values for Couchbase Helm chart
# See: https://docs.couchbase.com/operator/current/helm-setup-guide.html
#
# Install operator + admission controller in the Argo CD Application destination namespace (couchbase).
# scope: Role — reconcile Couchbase CRs only in that namespace (not cluster-wide). CouchbaseCluster lives in the same overlay path.

install:
  couchbaseOperator: true
  admissionController: true
  couchbaseCluster: false
  syncGateway: false

couchbaseOperator:
  scope: Role  # Namespace-scoped: watch and manage CRs only in the install namespace
  image:
    repository: registry.connect.redhat.com/couchbase/operator
    tag: "2.9.0"

admissionController:
  disableValidatingWebhook: true
  scope: Role  # Match operator: admission RBAC limited to install namespace (webhook disabled here)
  image:
    repository: registry.connect.redhat.com/couchbase/admission-controller
    tag: "2.9.0"

